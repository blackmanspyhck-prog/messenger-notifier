name: Send Notifications

on:
  schedule:
    - cron: '*/5 * * * *' # প্রতি ৫ মিনিটে চেক করবে
  workflow_dispatch: # চাইলে ম্যানুয়ালিও চালানো যাবে

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node index.js
